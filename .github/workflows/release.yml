name: DailyKit Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DAILYKIT_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > dailykit-upload.jks
          chmod 600 dailykit-upload.jks

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.DAILYKIT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAILYKIT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAILYKIT_KEY_PASSWORD }}
        run: |
          printf '%s\n' \
            "DAILYKIT_STORE_PASSWORD=$STORE_PASSWORD" \
            "DAILYKIT_KEY_ALIAS=$KEY_ALIAS" \
            "DAILYKIT_KEY_PASSWORD=$KEY_PASSWORD" \
            > keystore.properties

      - name: Build Release AAB
        run: ./gradlew clean bundleRelease --no-daemon

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: DailyKit-release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
